    <title>Registro de Usuario | IUJO</title>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/LOGO IUJO.jpg" alt="Logo IUJO" style="max-width: 300px;">
                </a>
            </div>
        </div>
    </header>

    <main role="main">
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="reservar.html">Reservar Cubículo</a></li>
                <li><a href="aulas.html">Aulas y Espacios</a></li>
                <li><a href="mis-reservas.html">Mis Reservas</a></li>
                <li><a href="biblioteca.html">Info Biblioteca</a></li>
                <li><a href="https://webiujocatia.wordpress.com/contacto/" target="_blank" rel="noopener noreferrer">Contacto</a></li>
            </ul>
        </nav>
        <hr>

        <section id="registro-usuario" style="padding: 20px;">
            <h2>Registro de Nuevo Usuario</h2>
            <p>Regístrese para poder solicitar cubículos.</p>

            <form action="/submit-registro" method="POST">
                <fieldset>
                    <legend><strong>Datos del Solicitante</strong></legend>

                    <div>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <br>
                    <div>
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
                    <br>
                    <div>
                        <label for="cedula">Cédula de Identidad:</label>
                        <input type="text" id="cedula" name="cedula" placeholder="V-12345678" required pattern="[VEve]-\d{7,9}">
                    </div>
                    <br>
                    <div>
                        <label for="email">Correo Electrónico (Gmail):</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required pattern="[a-zA-Z0-9._%+-]+@gmail\.com$">
                    </div>
                    <br>
                    <div>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <br>
                    <div>
                        <label for="repeat_password">Repetir Contraseña:</label>
                        <input type="password" id="repeat_password" name="repeat_password" required>
                    </div>
                    <br>
                    <div>
                        <label for="carrera">Carrera:</label>
                        <select id="carrera" name="carrera" required>
                            <option value="">-- Seleccione su carrera --</option>
                            <option value="informatica">Informática</option>
                            <option value="contaduria">Contaduría</option>
                            <option value="electronica">Electrónica</option>
                            <option value="mecanica">Mecánica</option>
                            <option value="otra">Otra</option>
                        </select>
                    </div>
                </fieldset>
                <br>
                <div>
                    <button type="submit">Registrarse</button>
                </div>
            </form>
        </section>
    </main>

    <footer style="background-color: #f4f4f4; padding: 20px; margin-top: 20px;">
        <div class="footer-container">
            <p>&copy; 2025 Instituto Universitario Jesús Obrero (IUJO).</p>
        </div>
    </footer>
</body>
</html>
